<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 460" width="500" height="460">
  <defs>
    <!-- Clip hex shape -->
    <clipPath id="hex-clip">
      <polygon points="250,35 389,115 389,275 250,355 111,275 111,115"/>
    </clipPath>
    <!-- Left half split -->
    <clipPath id="left-clip">
      <rect x="0" y="0" width="250" height="460"/>
    </clipPath>
    <!-- Right half split -->
    <clipPath id="right-clip">
      <rect x="250" y="0" width="250" height="460"/>
    </clipPath>
    <!-- Subtle glow for blue elements -->
    <filter id="blue-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ── White background ── -->
  <rect width="500" height="460" fill="white"/>

  <!-- ── Hexagon: left half dark, right half blue ── -->
  <g clip-path="url(#left-clip)">
    <polygon points="250,35 389,115 389,275 250,355 111,275 111,115" fill="#0D0F1A"/>
  </g>
  <g clip-path="url(#right-clip)">
    <polygon points="250,35 389,115 389,275 250,355 111,275 111,115" fill="#4F8EF7"/>
  </g>

  <!-- ── Hex border ── -->
  <polygon points="250,35 389,115 389,275 250,355 111,275 111,115"
           fill="none" stroke="#4F8EF7" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- ── Circuit traces (clipped to hex interior) ── -->
  <g clip-path="url(#hex-clip)">

    <!-- Left half: blue traces on dark bg -->
    <g clip-path="url(#left-clip)" filter="url(#blue-glow)">
      <!-- N — left vertical bar -->
      <line x1="183" y1="125" x2="183" y2="265" stroke="#4F8EF7" stroke-width="5" stroke-linecap="round"/>
      <!-- N — diagonal (left half: center at 250,195) -->
      <line x1="183" y1="125" x2="250" y2="195" stroke="#4F8EF7" stroke-width="5" stroke-linecap="round"/>
      <!-- Branch: top-left corner -->
      <polyline points="183,125 153,125 153,93" stroke="#4F8EF7" stroke-width="3"
                fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Branch: bottom-left -->
      <line x1="183" y1="265" x2="153" y2="265" stroke="#4F8EF7" stroke-width="3" stroke-linecap="round"/>
      <!-- Branch: mid-left -->
      <line x1="183" y1="195" x2="153" y2="195" stroke="#4F8EF7" stroke-width="3" stroke-linecap="round"/>
      <!-- Nodes -->
      <circle cx="153" cy="93"  r="5.5" fill="#4F8EF7"/>
      <circle cx="183" cy="125" r="5"   fill="#4F8EF7"/>
      <circle cx="183" cy="195" r="5"   fill="#4F8EF7"/>
      <circle cx="153" cy="195" r="5.5" fill="#4F8EF7"/>
      <circle cx="183" cy="265" r="5"   fill="#4F8EF7"/>
      <circle cx="153" cy="265" r="5.5" fill="#4F8EF7"/>
    </g>

    <!-- Right half: dark traces on blue bg -->
    <g clip-path="url(#right-clip)">
      <!-- N — diagonal (right half) -->
      <line x1="250" y1="195" x2="317" y2="265" stroke="#0D0F1A" stroke-width="5" stroke-linecap="round"/>
      <!-- N — right vertical bar -->
      <line x1="317" y1="125" x2="317" y2="265" stroke="#0D0F1A" stroke-width="5" stroke-linecap="round"/>
      <!-- Branch: top-right corner -->
      <polyline points="317,125 347,125 347,93" stroke="#0D0F1A" stroke-width="3"
                fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Branch: bottom-right -->
      <line x1="317" y1="265" x2="347" y2="265" stroke="#0D0F1A" stroke-width="3" stroke-linecap="round"/>
      <!-- Branch: mid-right -->
      <line x1="317" y1="195" x2="347" y2="195" stroke="#0D0F1A" stroke-width="3" stroke-linecap="round"/>
      <!-- Nodes -->
      <circle cx="347" cy="93"  r="5.5" fill="#0D0F1A"/>
      <circle cx="317" cy="125" r="5"   fill="#0D0F1A"/>
      <circle cx="317" cy="195" r="5"   fill="#0D0F1A"/>
      <circle cx="347" cy="195" r="5.5" fill="#0D0F1A"/>
      <circle cx="317" cy="265" r="5"   fill="#0D0F1A"/>
      <circle cx="347" cy="265" r="5.5" fill="#0D0F1A"/>
    </g>

    <!-- Centre split node (bicolor: half blue / half dark) -->
    <g clip-path="url(#left-clip)">
      <circle cx="250" cy="195" r="6" fill="#4F8EF7"/>
    </g>
    <g clip-path="url(#right-clip)">
      <circle cx="250" cy="195" r="6" fill="#0D0F1A"/>
    </g>

  </g>

  <!-- ── Wordmark ── -->
  <text x="250" y="416"
        text-anchor="middle"
        font-family="'Arial Black', 'Arial', 'Helvetica Neue', sans-serif"
        font-size="46"
        font-weight="900"
        letter-spacing="5">
    <tspan fill="#4F8EF7">NODE</tspan><tspan fill="#0D0F1A"> AXIS</tspan>
  </text>
</svg>
